baseURL = "https://casteels.dev"
title = "Maarten's Blog"
theme = "custom"

enableRobotsTXT = true

[params]
description = "Persoonlijke Nederlandstalige blog over software, samenwerking en dingen die het opschrijven waard zijn."
descriptionLong = "Persoonlijke Nederlandstalige blog van Maarten Casteels, met verhalen, reflecties en praktische stukken over software, samenwerking, home automation en tools die onderweg blijven hangen."
keywords = ["Maarten Casteels", "home automation", "domotica", "java", "agile", "software engineering"]
tagline = "Persoonlijke notities over software en wat blijft hangen"
author = "Maarten Casteels"
avatar = "/maarten.webp"
images = ["/maarten.png"]

[params.person]
name = "Maarten Casteels"
id = "https://casteels.dev/#person-maarten-casteels"
url = "https://casteels.dev"
image = "/maarten.webp"
worksFor = { name = "Sopra Steria BeLux", url = "https://www.soprasteria.be/" }
sameAs = [
  "https://github.com/denmette",
  "https://www.linkedin.com/in/maartencasteels",
  "https://bsky.app/profile/casteels.dev",
  "https://x.com/denmette",
  "https://denmette.be/"
]
[[params.person.memberOf]]
id="https://jcast.dev/#org"
name = "JCast"
url = "https://jcast.dev/"
roleName = "Co-host"

[[params.person.memberOf]]
name = "Top Vakantie VZW"
url = "https://www.topvakantie.be/"
roleName = "Vrijwilliger"

[params.comments]
repo = "denmette/denmette.github.io"
issueTerm = "og:title"
label = "comments"

languageCode = "nl-BE"
defaultContentLanguage = "nl"
defaultContentLanguageInSubdir = false

[languages]
  [languages.nl]
    locale = "nl-BE"
    label = "Nederlands"
    weight = 1

[pagination]
pagerSize = 5
disableAliases = true

[minify]
disableXML = true
minifyOutput = true

[permalinks]
posts = "/posts/:slug/"

[taxonomies]
tag = "tags"

[menus]
  [[menus.main]]
    identifier = "home"
    name = "Start"
    pageRef = "/"
    weight = 10
  [[menus.main]]
    identifier = "search"
    name = "Zoeken"
    pageRef = "/zoeken"
    weight = 20
  [[menus.main]]
    identifier = "tags"
    name = "Tags"
    pageRef = "/tags"
    weight = 30
  [[menus.main]]
    identifier = "about"
    name = "Over mij"
    pageRef = "/over-mij"
    weight = 40
  [[menus.main]]
    identifier = "privacy"
    name = "Privacy"
    pageRef = "/privacy"
    weight = 50

[markup.highlight]
noClasses = false

[markup.goldmark.renderer]
unsafe = true

[security.node.permissions]
allowAddons = ['tailwindcss', 'lightningcss']
allowChildProcess = ['tailwindcss']
allowRead = ['.']
allowWorker = ['tailwindcss']

[outputs]
home = ["HTML", "SITEMAP"]
section = ["HTML"]
taxonomy = ["HTML"]
term = ["HTML"]
page = ["HTML"]

[sitemap]
changefreq = "weekly"
priority = 0.5
filename = "sitemap.xml"
