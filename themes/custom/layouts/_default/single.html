{{ define "main" }}
<article class="space-y-4">
  <header class="space-y-2">
    <h1 class="text-2xl font-semibold text-slate-900 dark:text-slate-100">{{ .Title }}</h1>
  </header>

  <div class="space-y-4 text-slate-800 dark:text-slate-100">
    <div class="prose prose-slate max-w-none prose-headings:font-heading prose-h2:text-xl prose-h2:leading-7 prose-h2:mt-[1.6em] prose-h2:mb-[0.6em] prose-h3:text-lg prose-h3:leading-7 prose-h3:mt-[1.4em] prose-h3:mb-[0.5em] prose-h4:text-base prose-h4:font-semibold prose-h4:leading-6 prose-h4:mt-[1.2em] prose-h4:mb-[0.4em] prose-a:text-moss prose-a:no-underline prose-a:underline-offset-4 hover:prose-a:text-moss hover:prose-a:underline dark:prose-invert dark:prose-a:text-mustard dark:hover:prose-a:text-mustard dark:hover:prose-a:underline">
      {{ .Content }}
    </div>
  </div>
</article>
{{ end }}
