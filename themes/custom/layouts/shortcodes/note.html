{{- $title := .Get "title" | default "Kort uitgelegd" -}}
<aside class="not-prose my-6 ml-4 border-l-4 border-slate-300 pl-4 text-slate-600 dark:border-slate-700 dark:text-slate-300">
  <p class="m-0 text-sm font-semibold tracking-tight text-slate-900 dark:text-slate-100">{{ $title }}</p>
  <div class="mt-2 text-sm leading-7">
    {{ .Inner | .Page.RenderString }}
  </div>
</aside>
