{{- $page := .page -}}
<ul class="{{ .class }}">
  {{- range site.Menus.main }}
  {{- $isCurrent := or ($page.IsMenuCurrent "main" .) ($page.HasMenuCurrent "main" .) (eq $page.RelPermalink .URL) -}}
  <li>
    <a class="rounded px-2 py-1 text-slate-700 hover:text-moss hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-moss dark:text-slate-300 dark:hover:text-mustard dark:focus-visible:outline-moss {{ if $isCurrent }}text-moss dark:text-mustard{{ end }}" href="{{ .URL }}"{{ if $isCurrent }} aria-current="page"{{ end }}>{{ .Name }}</a>
  </li>
  {{- end }}
</ul>
