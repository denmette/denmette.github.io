name: Deploy Hugo Site to S3

on:
  push:
    branches:
      - main
  schedule:
    # GitHub Actions cron runs in UTC. 07:05 UTC is 09:05 in Belgium during CEST.
    - cron: "5 7 26 8 *"
    - cron: "5 7 9,23 9 *"
    - cron: "5 7 14 10 *"

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy Hugo Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Hugo
        uses: denmette/actions-hugo@v1.0.1
        with:
          hugo-version: '0.164.0'
          extended: true

      - name: Cache Hugo Modules
        uses: actions/cache@v5
        with:
          path: ~/.cache/hugo
          key: ${{ runner.os }}-hugo-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: Build Site
        run: npm run build

      - name: Capture previous sitemap
        run: curl -fsS https://casteels.dev/sitemap.xml -o /tmp/previous-sitemap.xml || true

      - name: Detect initial IndexNow publish
        id: indexnow
        run: |
          if curl -fsS https://casteels.dev/a9396471fd0ec31f789c1992bb07f313.txt >/dev/null; then
            echo "initial_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "initial_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Sync to S3
        run: aws s3 sync public/ s3://${{ secrets.S3_BUCKET_NAME }}/ --delete

      - name: Submit all sitemap URLs to IndexNow
        if: steps.indexnow.outputs.initial_publish == 'true'
        run: node scripts/indexnow-submit.mjs --site-url https://casteels.dev --current-sitemap public/sitemap.xml --key-file public/a9396471fd0ec31f789c1992bb07f313.txt

      - name: Submit changed URLs to IndexNow
        if: steps.indexnow.outputs.initial_publish != 'true'
        run: node scripts/indexnow-submit.mjs --site-url https://casteels.dev --previous-sitemap /tmp/previous-sitemap.xml --current-sitemap public/sitemap.xml --key-file public/a9396471fd0ec31f789c1992bb07f313.txt
